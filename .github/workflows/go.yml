name: Go

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go_version: ['1.21', '1.22', '1.23']
        os: ['ubuntu-latest', 'ubuntu-18.04']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go_version }}
          cache: true

      - name: Debug docker
        run: |
          docker --version
          docker compose version

      - name: Build DB
        run: docker compose build

      - name: Create DB
        run: docker compose up -d

      - name: Wait for Postgres
        run: |
          # tenta por até 30s
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U root && { echo "Postgres pronto"; exit 0; }
            echo "Aguardando Postgres..."
            sleep 1
          done
          echo "Postgres não ficou pronto — logs:" >&2
          docker compose logs postgres
          exit 1

      - name: Test
        run: go test -v ./...

      - name: Shutdown DB
        if: always()
        run: docker compose down -v

  build:
    needs: test
    runs-on: ${{ matrix.os }}
 

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build
        run: go build -v ./...
